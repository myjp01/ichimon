<title>証券化マスター 一問一答</title>
<style>
/* Layout: notahotel.com の作り（2026-10-23 実測）を移した一画面アプリ。白い地、黒いヒーロー、青い丸ボタンは1色だけ */
:root{
  --white:#FFFFFF; --ink:#0B0B0D; --black:#000000; --grey:#858A95; --grey2:#A3A8B1; --hair:#E6E6E8; --mist:#F4F4F5;
  --blue:#0171E3; --blue-soft:#E8F1FD;
  /* 合言葉画面（build_app.py）が使う名前 */
  --card:var(--white); --line:var(--hair); --sub:var(--grey); --ng:#C2261B;
  --jp:"Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  --latin:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --num:"Antonio","HNC","Helvetica Neue",sans-serif;
  color-scheme:light;
}
@font-face{font-family:"HNC";src:local("HelveticaNeue-CondensedBold");font-weight:600 700}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--white);color:var(--ink);font-family:var(--jp);font-size:16px;line-height:1.75;-webkit-text-size-adjust:100%;font-feature-settings:"palt";-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:20px;padding-block:16px 150px}
.wrap.flush{padding-inline:0;padding-top:0}
.pad{padding-inline:20px}
h1{font-weight:700;font-size:1.5rem;line-height:1.35;margin:8px 0 4px;letter-spacing:.02em}
.lede{color:var(--grey);font-size:.85rem;margin:0;line-height:1.7}
.label{font-size:.8rem;letter-spacing:.04em;color:var(--ink);margin:0 0 10px;font-weight:600}
section{margin-top:34px}

/* ヘッダー */
.hdr{display:flex;align-items:center;justify-content:space-between;height:60px}
.hdr .mark{display:flex}
.hdr .r{font-size:.75rem;color:var(--grey);letter-spacing:.04em}
/* 黒いヒーロー */
.hero{position:relative;background:radial-gradient(90% 70% at 85% 0%,#2a2c30 0%,#121315 55%,#08080a 100%);color:#fff;padding:22px 20px 26px;overflow:hidden}
.stories{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px 2px}
.stories::-webkit-scrollbar{display:none}
.st{flex:0 0 60px;height:60px;border-radius:50%;padding:3px;border:1.5px solid rgba(255,255,255,.5);background:none;display:flex}
.st span{flex:1;border-radius:50%;background:#26282c;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:500;font-size:19px;letter-spacing:.02em;color:#fff}
.st[aria-pressed="true"]{border:3px solid var(--blue);padding:2px}
.st[aria-pressed="true"] span{background:#3a3d42}
.kick{margin:26px 0 0;text-align:center;font-size:.8rem;letter-spacing:.12em;color:rgba(255,255,255,.85)}
.ttl{margin:2px 0 0;text-align:center;font-weight:700;font-size:3.6rem;line-height:1.15;letter-spacing:.04em}
.scope{margin:6px 0 0;text-align:center;font-size:.75rem;line-height:1.6;color:rgba(255,255,255,.6);text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:repeat(3,1fr);margin-top:22px;border-top:1px solid rgba(255,255,255,.14)}
.facts div{padding:14px 4px 0;text-align:center}
.facts div+div{border-left:1px solid rgba(255,255,255,.14)}
.facts b{display:block;font-family:var(--num);font-weight:600;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.facts b small{font-size:.55em;margin-left:2px}
.facts span{display:block;margin-top:6px;font-size:.7rem;color:rgba(255,255,255,.6)}
.sel{position:relative;display:flex;align-items:center;margin-top:22px;height:54px;border-radius:999px;background:rgba(255,255,255,.13);box-shadow:inset 0 0 0 1px rgba(255,255,255,.10)}
.sel span{position:absolute;left:22px;font-size:.75rem;color:rgba(255,255,255,.6);pointer-events:none}
.sel::after{content:"";position:absolute;right:22px;top:50%;width:8px;height:8px;margin-top:-6px;border-right:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(45deg);pointer-events:none}
.sel select{appearance:none;-webkit-appearance:none;width:100%;height:100%;border:0;background:none;color:#fff;font:inherit;font-size:16px;font-weight:600;padding:0 46px 0 64px;border-radius:999px;text-overflow:ellipsis}
.sel select option{color:#000}

/* 白いセクション */
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 12px}
.sec b{font-weight:600;font-size:1.05rem;letter-spacing:.04em}
.sec span{font-size:.8rem;color:var(--grey)}
.modes{border-top:1px solid var(--hair)}
.mode{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:none;border:0;border-bottom:1px solid var(--hair);padding:14px 2px}
.mode b{display:block;font-size:.98rem;font-weight:600}

.mode[aria-pressed="true"] b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue);margin:0 8px 2px 0;vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.vsel{width:100%;font:inherit;font-size:16px;padding:12px 16px;border-radius:999px;border:1px solid var(--hair);background:#fff;color:var(--ink)}
.chip{border:1px solid var(--hair);background:var(--white);border-radius:999px;padding:9px 18px;font-size:.88rem;line-height:1.3}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:20px;scrollbar-width:none;margin:0 -20px;padding:0 20px 4px}
.rail::-webkit-scrollbar{display:none}
.scard{flex:0 0 232px;scroll-snap-align:start;text-align:left;background:none;border:0;padding:0}
.scard .img{position:relative;height:176px;border-radius:6px;overflow:hidden;background:radial-gradient(80% 80% at 50% 40%,#232428 0%,#0d0d0f 100%);display:flex;align-items:center;justify-content:center}
.scard .img svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.cn{position:relative;display:flex;align-items:baseline;gap:2px;color:#fff}
.cn b{font-family:var(--num);font-weight:600;font-size:2.9rem;line-height:1}
.cn span{font-weight:600;font-size:.75rem}
.tagw{position:absolute;left:10px;bottom:10px;background:#fff;color:#000;border-radius:2px;padding:4px 7px 3px;font-size:.68rem;line-height:1.2}
.scard[aria-pressed="true"] .img{box-shadow:inset 0 0 0 3px var(--blue)}
.loc{margin-top:10px;font-family:var(--num);font-weight:500;font-size:1rem;color:var(--grey);letter-spacing:.02em}
.ja{font-weight:300;font-size:.92rem;line-height:1.5}
.fact{margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;font-size:.82rem;letter-spacing:.02em}
.fact b{font-weight:500} .fact span{color:var(--grey)}
.note{font-size:.72rem;color:var(--grey);line-height:1.7;margin-top:34px}
.linkbtn{background:none;border:0;padding:0;color:var(--grey);text-decoration:underline;font-size:.72rem}
.banner{display:block;width:calc(100% - 40px);margin:12px 20px 0;text-align:left;border:0;background:var(--blue-soft);color:var(--ink);border-radius:6px;padding:12px 14px;font-size:.85rem}
.banner::before{content:"NEW";font-family:var(--latin);font-size:.7rem;background:#fff;border-radius:2px;padding:2px 6px;margin-right:8px}

/* 下の帯（浮かぶ丸ボタン） */
.bar{position:fixed;left:0;right:0;bottom:0;padding:18px 20px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.92) 38%,#fff 100%);pointer-events:none}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:10px;pointer-events:auto}
.big{flex:1;border:0;border-radius:999px;height:58px;padding:0 14px;white-space:nowrap;font-weight:600;font-size:1.02rem;letter-spacing:.04em;background:var(--blue);color:#fff;box-shadow:0 8px 24px -10px rgba(1,113,227,.55)}
.big:disabled{background:var(--grey2);box-shadow:none}
.big.ok{background:var(--blue)} .big.ng{background:var(--ink);box-shadow:0 8px 24px -10px rgba(0,0,0,.5)}
.big.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
#again{flex:1.6}
.ans{flex:1;height:72px;border-radius:999px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:.95rem;letter-spacing:.06em}
.ans svg{display:block}

/* 出題 */
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;height:52px}
.top .back{background:none;border:0;color:var(--grey);font-size:.85rem;padding:4px 0}
.prog{font-family:var(--num);font-weight:500;font-size:1.05rem;color:var(--grey);font-variant-numeric:tabular-nums}
.prog b{color:var(--ink);font-weight:600;font-size:1.35rem}
.track{height:2px;background:var(--hair);overflow:hidden}
.track i{display:block;height:100%;background:var(--ink);width:0;transition:width .25s}
.src{font-size:.75rem;color:var(--grey);margin:18px 0 0;line-height:1.55}
.lead{font-size:.88rem;color:var(--ink);margin:10px 0 0;line-height:1.75;font-weight:300}
.hint{font-size:.72rem;color:var(--grey);margin:12px 0 0}
.ctx{margin-top:14px;border-left:2px solid var(--hair);padding:2px 0 2px 14px;font-size:.85rem;line-height:1.75;color:var(--grey)}
.ctx p{margin:0 0 6px}
.ctx .label{color:var(--grey);margin-bottom:6px}
.q{border-top:1px solid var(--ink);padding:18px 0 0;margin-top:14px;font-size:1.1rem;line-height:1.95}
.q .lab{font-family:var(--num);font-weight:600;color:var(--blue);margin-right:8px}
.result{margin-top:26px;border-top:1px solid var(--hair);padding-top:18px}
.result h2{margin:0;font-size:1.6rem;font-weight:700;line-height:1.2;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.result.ok h2{color:var(--blue)} .result.ng h2{color:var(--ink)}
.result h2 span{font-size:.85rem;color:var(--grey);font-weight:500}
.why{margin:12px 0 0;font-size:.98rem;line-height:1.9}
.why b{font-weight:600;background:linear-gradient(transparent 62%,var(--blue-soft) 62%)}
.tools{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.tool{border:1px solid var(--hair);background:#fff;border-radius:999px;padding:8px 16px;font-size:.8rem}
.tool[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.full{margin-top:14px;border-top:1px solid var(--hair);padding-top:12px;font-size:.85rem;line-height:1.75}
.full p{margin:0 0 8px}
.full .cur{background:var(--blue-soft);padding:2px 4px;margin-inline:-4px}
.hist{font-size:.72rem;color:var(--grey);margin-top:12px}

/* 結果 */
.score{display:flex;align-items:baseline;gap:8px;margin-top:22px;font-family:var(--num);font-weight:600;font-size:5.5rem;line-height:.9}
.score small{font-size:.32em;color:var(--grey);font-weight:500}
.score em{font-family:var(--jp);font-style:normal;font-size:.18em;color:var(--grey);font-weight:400;margin-left:6px}
.list{border-top:1px solid var(--hair);margin-top:12px}
.row{border-bottom:1px solid var(--hair);padding:12px 0;font-size:.88rem;line-height:1.7}
.row .s{font-size:.72rem;color:var(--grey)}

/* 文言検索 */
.search{position:relative;margin-top:22px}
.search input{width:100%;font:inherit;font-size:16px;padding:14px 46px 14px 20px;border-radius:999px;border:0;background:var(--mist);color:var(--ink);-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--grey)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none}
.sqx{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--grey);font-size:1.3rem;width:36px;height:36px;line-height:1}
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:18px;font-size:.85rem}
.shead b{font-family:var(--num);font-weight:600;font-size:1.4rem}
.hits{border-top:1px solid var(--hair);margin-top:10px}
.hit{border-bottom:1px solid var(--hair)}
.hitbtn{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 0;font-size:.9rem;line-height:1.7}
.hitbtn .s{font-size:.72rem;color:var(--grey);display:block}
.hitbtn .hw{display:block;font-size:.8rem;color:var(--grey);margin-top:4px}
.ox{display:inline-block;font-weight:700;margin-right:6px}
.ox.o{color:var(--blue)} .ox.x{color:var(--ink)}
mark{background:var(--blue-soft);color:var(--ink);padding:0 1px}
.hexp{padding:0 0 14px;font-size:.85rem;line-height:1.8}
.hexp p{margin:0 0 6px}
.hexp b{font-weight:600}
.more{width:100%;margin-top:14px;border:1px solid var(--hair);background:#fff;border-radius:999px;padding:12px;font-size:.85rem;color:var(--blue)}
@media (prefers-reduced-motion:reduce){.track i{transition:none}}
</style>

<div class="wrap" id="app"></div>
<div class="bar"><div class="in" id="bar"></div></div>

<script>
function main(DATA){
const SUBJ = {"101":"企業と不動産","102":"証券化の概要","103":"不動産投資の基礎","104":"法務・会計・税務","105":"ファイナンス","106":"倫理行動"};
const KEY = "sm-ichimon-v1";
const cards = DATA.cards, byId = {};
cards.forEach(c => byId[c.id] = c);

let store = {h:{}, star:{}, pref:{subj:[], unit:"", mode:"rand", n:20, voice:"off", vname:"", rq:1, rw:1}};
function load(){
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "null");
    if (s) store = {h: s.h || {}, star: s.star || {}, pref: Object.assign({subj:[], unit:"", mode:"rand", n:20, voice:"off", vname:"", rq:1, rw:1}, s.pref)};
  } catch(e){}
  if (!Array.isArray(store.pref.subj)) store.pref.subj = [];
}
load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }

const $app = document.getElementById("app"), $bar = document.getElementById("bar");
let barAt = 0, view = "home";
/* 下の帯のボタンは押した場所に次のボタンが出るので、続けて2回タップしても2回目は無視する */
const setBarHTML = html => { $bar.innerHTML = html; barAt = performance.now(); };
const tap = fn => e => { if (performance.now() - barAt < 350) return; fn(e); };
const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const qkey = c => c.id.slice(0, c.id.lastIndexOf("-"));
const srcText = c => `${c.y}年 ${c.s} 問${c.n}　${c.subj} ${SUBJ[c.subj]}／${c.uname}`;

function inScope(){
  const p = store.pref;
  return cards.filter(c => (!p.subj.length || p.subj.includes(c.subj)) && (!p.unit || c.unit === p.unit));
}
const MODES = [
  ["rand","ランダム","範囲の中からまんべんなく", a => a],
  ["new","まだ解いていない肢","一度も答えていないものだけ", a => a.filter(c => !store.h[c.id])],
  ["miss","前回まちがえた肢","最後の回答が不正解のもの", a => a.filter(c => store.h[c.id] && !store.h[c.id][2])],
  ["weak","一度でもまちがえた肢","いまは正解でも、過去に落としたもの", a => a.filter(c => store.h[c.id] && store.h[c.id][1] > 0)],
  ["star","★見直しリスト","自分で印をつけた肢", a => a.filter(c => store.star[c.id])],
];
if (!MODES.some(m => m[0] === store.pref.mode)) store.pref.mode = "rand";

/* ---------- 音声（読み上げ） ---------- */
/* 読み上げ用に文を整える：タグと出典を外し、略語と記号を読みやすくする。車用の音声ファイル（build_audio.py）と同じ規則 */
const READ = [[/<[^>]+>/g,""],[/[（(][^（）()]*(?:講義資料|協会の|別紙|p\.\s?\d)[^（）()]*[）)]/g,""],
  [/J-?REIT/g,"ジェイリート"],[/REIT/g,"リート"],[/GK-TK/g,"ジーケー・ティーケー"],[/TMK/g,"ティーエムケー"],
  [/\bAM\b/g,"エーエム"],[/\bPM\b/g,"ピーエム"],[/\bER\b/g,"イーアール"],[/[○◯]/g,"まる"],[/×/g,"ばつ"],[/(?<=[\d)）])\/(?=[\d(（])/g,"割る"],[/²/g,"の2乗"],[/³/g,"の3乗"],
  [/(\d)\s*[–—~〜～]\s*(\d)/g,"$1から$2"],[/[〜～]/g,"から"],[/[／/→]/g,"、"],[/［([^］]+)］/g,"空欄$1"],[/\s+/g," "]];
const forSpeech = t => READ.reduce((s, [a, b]) => s.replace(a, b), String(t)).trim();
const sentences = t => forSpeech(t).split(/(?<=[。！？])/).map(x => x.trim()).filter(Boolean);
/* 柱書の決まり文句（次の記述のうち…どれか）を外し、事例の説明が残るときだけ読む */
const leadForSpeech = c => { const r = c.lead.replace(/[（(]問題\d+は[^）)]*[）)]/g, "").replace(/[、。]?\s*(?:次の|以下の|下記の)[^。]*?(?:どれか|いくつあるか)[。．]?\s*$/, ""); return r.length >= 40 ? r : ""; };
const RATE = { get q(){ return +store.pref.rq || 1; }, get why(){ return +store.pref.rw || 1; } };  /* 速さはホームの「音声」で選ぶ */
const SPEEDS = [[0.8,"ゆっくり"],[0.9,"やや遅め"],[1,"ふつう"],[1.1,"やや速め"],[1.2,"速め"]];
const TTS = (() => {
  const ok = "speechSynthesis" in window; let voice = null, gen = 0;
  /* 日本語の声だけ。おもちゃの声（Eddy・Grandma など）は外し、プレミアム＞拡張＞標準の順に並べる */
  const grade = v => /premium|プレミアム/i.test(v.voiceURI + v.name) ? 3 : /enhanced|拡張|高音質/i.test(v.voiceURI + v.name) ? 2 : 1;
  const list = () => ok ? speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang) && !/eloquence|novelty/i.test(v.voiceURI) && !/^(Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley)\b/.test(v.name)).sort((a, b) => grade(b) - grade(a)) : [];
  const pick = () => { const vs = list(); voice = vs.find(v => v.voiceURI === store.pref.vname) || vs[0] || null; };
  if (ok) { pick(); speechSynthesis.onvoiceschanged = () => { pick(); if (view === "home" && window.__home) window.__home(); }; }
  const one = (t, r, my) => new Promise(res => {
    if (my !== gen) return res(false);
    const u = new SpeechSynthesisUtterance(t); u.lang = "ja-JP"; if (voice) u.voice = voice; u.rate = r;
    u.onend = () => res(my === gen); u.onerror = () => res(false); speechSynthesis.speak(u);
  });
  /* parts: [[文, 速さ], …]。止められたら false を返す */
  async function say(parts){
    if (!ok) return false; const my = ++gen; speechSynthesis.cancel();
    for (const [t, r] of parts) for (const s of sentences(t)) { if (!(await one(s, r, my))) return false; }
    return my === gen;
  }
  function stop(){ gen++; if (ok) speechSynthesis.cancel(); }
  const label = v => `${v.name.replace(/\s*[（(].*$/, "")}${grade(v) === 3 ? "（プレミアム）" : grade(v) === 2 ? "（拡張）" : ""}`;
  return {ok, say, stop, live: () => gen, list, pick, label, current: () => voice};
})();
const sleep = ms => new Promise(r => setTimeout(r, ms));
let wake = null;
const holdScreen = async on => { try { if (on && !wake && navigator.wakeLock) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => wake = null); } if (!on && wake) { await wake.release(); wake = null; } } catch(e){} };
const questionParts = c => [[leadForSpeech(c), RATE.q], ...(c.ctx ? [["まず、前提となる記述です。", RATE.q], ...c.ctx.map(([l,t]) => [t, RATE.q]), ["では、次の記述です。", RATE.q]] : []), [c.q, RATE.q]];
const answerWords = (c, ok) => `${ok === null ? "" : ok ? "正解です。" : "不正解です。"}${ok === null ? `答えは、${c.a ? "まる" : "ばつ"}です。` : ""}この記述は、${c.a ? "正しい" : "誤り"}です。`;
const VOICES = [["off","なし","画面だけで解く"],["on","読み上げ","問題と解説を読み上げる。答えは画面で押す"],["auto","聞き流し","読み上げ→考える間→正解と解説→自動で次へ。記録は残らない"]];

/* ---------- 目盛りの輪（科目のカード） ---------- */
const SUNITS = {}; cards.forEach(c => { (SUNITS[c.subj] = SUNITS[c.subj] || new Set()).add(c.unit); });
Object.keys(SUNITS).forEach(s => SUNITS[s] = [...SUNITS[s]].sort());
const UCARDS = {}; cards.forEach(c => (UCARDS[c.unit] = UCARDS[c.unit] || []).push(c.id));
function ring(n, filled, active, size, ro, ri){
  const c = size / 2, gap = n > 1 ? 2.4 : 0.001; let out = "";
  for (let i = 0; i < n; i++){
    const a0 = (-90 + i * 360 / n + gap / 2) * Math.PI / 180, a1 = (-90 + (i + 1) * 360 / n - gap / 2) * Math.PI / 180;
    const P = (r, a) => `${(c + r * Math.cos(a)).toFixed(2)},${(c + r * Math.sin(a)).toFixed(2)}`;
    const lg = (a1 - a0) > Math.PI ? 1 : 0;
    const d = n === 1
      ? `M${c},${c-ro} A${ro},${ro} 0 1 1 ${c-0.01},${c-ro} L${c-0.01},${c-ri} A${ri},${ri} 0 1 0 ${c},${c-ri} Z`
      : `M${P(ro,a0)} A${ro},${ro} 0 ${lg} 1 ${P(ro,a1)} L${P(ri,a1)} A${ri},${ri} 0 ${lg} 0 ${P(ri,a0)} Z`;
    const paint = i === active ? 'fill="#0171E3"' : filled[i] ? 'fill="#fff"' : 'fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="1.3"';
    out += `<path d="${d}" ${paint}/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">${out}</svg>`;
}
const OXSVG = {
  o: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>`,
  x: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true"><g stroke="currentColor" stroke-width="2"><line x1="3.5" y1="3.5" x2="20.5" y2="20.5"/><line x1="20.5" y1="3.5" x2="3.5" y2="20.5"/></g></svg>`,
};
const MARK = `<svg width="46" height="22" viewBox="0 0 46 22" aria-label="○×"><circle cx="11" cy="11" r="9" fill="none" stroke="#000" stroke-width="3"/><g stroke="#000" stroke-width="4"><line x1="28" y1="3" x2="44" y2="19"/><line x1="44" y1="3" x2="28" y2="19"/></g></svg>`;

/* ---------- 文言検索 ---------- */
let searchQ = "", shown = 60, HAY = null;
const stripTags = s => s.replace(/<[^>]+>/g, "");
const terms = q => q.normalize("NFKC").toLowerCase().split(/\s+/).filter(Boolean);
function search(q){
  const ts = terms(q); if (!ts.length) return [];
  if (!HAY) HAY = cards.map(c => [c.q, c.lead, stripTags(c.why), c.uname, c.item, `${c.y}年${c.s}問${c.n}`].join("\n").normalize("NFKC").toLowerCase());
  return cards.filter((c, i) => ts.every(t => HAY[i].includes(t)));
}
function hl(text, ts){
  const t = text.normalize("NFKC"), low = t.toLowerCase(), mk = new Array(t.length).fill(false);
  ts.forEach(x => { let i = 0; while ((i = low.indexOf(x, i)) !== -1) { for (let k = i; k < i + x.length; k++) mk[k] = true; i += x.length; } });
  let out = "", on = false;
  for (let k = 0; k < t.length; k++) { if (mk[k] !== on) { out += on ? "</mark>" : "<mark>"; on = mk[k]; } out += esc(t[k]); }
  return on ? out + "</mark>" : out;
}
function snip(text, ts){
  const t = text.normalize("NFKC"), low = t.toLowerCase();
  let i = -1; for (const x of ts) { i = low.indexOf(x); if (i >= 0) break; }
  if (i < 0) return "";
  const a = Math.max(0, i - 30), b = Math.min(t.length, i + 60);
  return (a ? "…" : "") + hl(t.slice(a, b), ts) + (b < t.length ? "…" : "");
}

/* ---------- 出題 ---------- */
let run = null;
function start(list){ run = {list, i:0, log:[], auto: store.pref.voice === "auto", paused: false}; if (run.auto) holdScreen(true); ask(); }
function ask(){
  view = "quiz";
  const c = run.list[run.i];
  $app.className = "wrap";
  $app.innerHTML = `
    <div class="top"><button class="back" id="quit">← やめる</button><span class="prog"><b>${run.i+1}</b> / ${run.list.length}</span></div>
    <div class="track"><i style="width:${run.i/run.list.length*100}%"></i></div>
    <p class="src">${esc(srcText(c))}</p>
    <p class="lead">${esc(c.lead)}</p>
    <p class="hint">問題文が「誤っているもの」を問う形でも、この肢そのものが正しいか誤りかを答えます</p>
    ${c.ctx ? `<div class="ctx"><p class="label">前提になる肢</p>${c.ctx.map(([l,t]) => `<p><b>${esc(l)}．</b>${esc(t)}</p>`).join("")}</div>` : ""}
    <div class="q" style="margin-top:6px"><span class="lab">${esc(c.lab)}</span>${esc(c.q)}</div>
    <div id="after"></div>`;
  document.getElementById("quit").onclick = () => { TTS.stop(); holdScreen(false); (run.log.length ? finish() : home()); };
  window.scrollTo(0,0);
  if (run.auto) return autoPlay(c);
  setBarHTML(`<button class="ans o" data-a="1">${OXSVG.o(24)}正しい</button><button class="ans x" data-a="0">${OXSVG.x(22)}誤り</button>`);
  $bar.querySelectorAll("[data-a]").forEach(b => b.onclick = tap(() => answer(c, b.dataset.a === "1")));
  if (store.pref.voice === "on") TTS.say(questionParts(c));
}
/* 聞き流し：読み上げ→考える間（4秒）→正解と解説→次へ。答えは記録しない */
async function autoPlay(c){
  const i = run.i;
  const bar = paused => {
    setBarHTML(paused ? `<button class="big" id="resume">▶ 再開</button><button class="big ghost" id="skip">次へ</button>` : `<button class="big ghost" id="pause">一時停止</button><button class="big ghost" id="skip">次へ</button>`);
    const pz = document.getElementById("pause"), rs = document.getElementById("resume");
    if (pz) pz.onclick = tap(() => { run.paused = true; TTS.stop(); bar(true); });
    if (rs) rs.onclick = tap(() => { run.paused = false; ask(); });
    document.getElementById("skip").onclick = tap(() => { TTS.stop(); next(); });
  };
  const alive = () => view === "quiz" && run && run.i === i && !run.paused;
  const next = () => { run.paused = false; if (run.i < run.list.length - 1) { run.i++; ask(); } else finish(); };
  bar(false);
  if (!(await TTS.say([...questionParts(c), ["まるか、ばつか。", RATE.q]])) || !alive()) return;
  await sleep(4000); if (!alive()) return;
  reveal(c, null);
  if (!(await TTS.say([[answerWords(c, null), RATE.q], ["解説です。", RATE.q], [c.why, RATE.why]])) || !alive()) return;
  await sleep(1200); if (!alive()) return;
  run.log.push([c.id, null]);
  next();
}
function answer(c, said){
  const ok = said === c.a;
  const h = store.h[c.id] || [0,0,0,0];
  h[ok?0:1]++; h[2] = ok?1:0; h[3] = Date.now(); store.h[c.id] = h; save();
  run.log.push([c.id, ok]);
  reveal(c, ok);
  if (store.pref.voice === "on") TTS.say([[answerWords(c, ok), RATE.q], ["解説です。", RATE.q], [c.why, RATE.why]]);
}
/* 正誤と解説を出す。ok が null のときは聞き流し（答えていない） */
function reveal(c, ok){
  const h = store.h[c.id] || [0,0,0,0];
  const f = DATA.full[qkey(c)];
  document.getElementById("after").innerHTML = `
    <div class="result ${ok === false ? "ng" : "ok"}">
      <h2>${ok === null ? "答え" : ok ? "正解" : "不正解"}<span>この肢は${c.a ? "○ 正しい" : "× 誤り"}</span></h2>
      <p class="why">${c.why}</p>
    </div>
    <div class="tools">
      <button class="tool" id="star" aria-pressed="${!!store.star[c.id]}">${store.star[c.id] ? "★ 見直しリストに入っています" : "☆ 見直しリストに入れる"}</button>
      ${f ? `<button class="tool" id="showfull">問題の全文を見る</button>` : ""}
    </div>
    <div id="fullbox"></div>
    <p class="hist">この肢の記録：正解 ${h[0]}回・不正解 ${h[1]}回</p>`;
  const st = document.getElementById("star");
  st.onclick = () => { if (store.star[c.id]) delete store.star[c.id]; else store.star[c.id] = 1; save();
    st.setAttribute("aria-pressed", !!store.star[c.id]); st.textContent = store.star[c.id] ? "★ 見直しリストに入っています" : "☆ 見直しリストに入れる"; };
  const sf = document.getElementById("showfull");
  if (sf) sf.onclick = () => { sf.remove();
    document.getElementById("fullbox").innerHTML = `<div class="full"><p>${esc(f.lead)}</p>${f.items.map(([l,t]) => `<p class="${l===c.lab?"cur":""}"><b>${esc(l)}．</b>${esc(t)}</p>`).join("")}</div>`; };
  const last = run.i === run.list.length - 1;
  if (ok === null) { const r = document.querySelector(".result").getBoundingClientRect(); if (r.top > window.innerHeight - 160) window.scrollBy(0, r.top - Math.round(window.innerHeight * 0.3)); return; }
  setBarHTML(`<button class="big ${ok ? "ok" : "ng"}" id="next">${ok ? "○ 正解" : "× 不正解"}　—　${last ? "結果を見る" : "次へ"}</button>`);
  document.getElementById("next").onclick = tap(() => { TTS.stop(); if (last) finish(); else { run.i++; ask(); } });
  document.querySelector(".track i").style.width = `${(run.i+1)/run.list.length*100}%`;
  const r = document.querySelector(".result").getBoundingClientRect(), lim = window.innerHeight - $bar.offsetHeight;
  if (r.top > lim - 80) window.scrollBy(0, r.top - Math.round(window.innerHeight * 0.3));
}

/* ---------- 結果 ---------- */
function finish(){
  view = "result"; TTS.stop(); holdScreen(false);
  $app.className = "wrap";
  if (run.auto) {
    $app.innerHTML = `<h1>おつかれさまでした</h1><div class="score">${run.log.length}<small>肢</small><em>聞き流しました</em></div><p class="lede" style="margin-top:14px">聞き流しでは答えを押していないので、記録は変わっていません。</p>`;
    setBarHTML(`<button class="big" id="home">メニューへ</button>`);
    document.getElementById("home").onclick = tap(() => home());
    window.scrollTo(0,0); return;
  }
  const n = run.log.length, r = run.log.filter(x => x[1]).length;
  const wrong = run.log.filter(x => !x[1]).map(x => byId[x[0]]);
  $app.innerHTML = `
    <h1>おつかれさまでした</h1>
    <div class="score">${r}<small>/ ${n}</small><em>正解（${n ? Math.round(r/n*100) : 0}%）</em></div>
    ${wrong.length ? `<section><p class="label">まちがえた肢</p><div class="list">${wrong.map(c => `<div class="row"><div class="s">${esc(srcText(c))}　正解：${c.a?"○":"×"}</div>${esc(c.q)}</div>`).join("")}</div></section>` : `<section><p class="lede">全問正解です。</p></section>`}`;
  setBarHTML(`${wrong.length ? `<button class="big" id="again">まちがえた肢をもう一度</button>` : ""}<button class="big${wrong.length ? " ghost" : ""}" id="home">メニューへ</button>`);
  if (wrong.length) document.getElementById("again").onclick = tap(() => start(shuffle(wrong.slice())));
  document.getElementById("home").onclick = tap(() => home());
  window.scrollTo(0,0);
}
/* 別のタブやアプリで記録が増えていたら、戻ってきたときに読み直す（古い記録で上書きしない） */
const refresh = () => { load(); if (view === "home") home(true); };
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { refresh(); if (run && run.auto && view === "quiz") holdScreen(true); } });
window.addEventListener("pageshow", e => { if (e.persisted) refresh(); });
window.__home = () => { if (view === "home") home(true); };
home();
}
const PKEY = "sm-ichimon-pass", ITER = 250000;
const normPw = s => s.normalize("NFKC").toLowerCase().replace(/\s+/g, "");
async function decrypt(pw){
  if (!window.crypto || !crypto.subtle) throw new Error("insecure");
  const res = await fetch("data.enc");
  if (!res.ok) throw new Error("net");
  const buf = new Uint8Array(await res.arrayBuffer());
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:buf.slice(0,16), iterations:ITER, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:buf.slice(16,28)}, key, buf.slice(28));
  return JSON.parse(new TextDecoder().decode(plain));
}
const wrongPw = e => e && e.name === "OperationError";
function failScreen(e){
  const app = document.getElementById("app"), bar = document.getElementById("bar");
  app.innerHTML = `<h1>証券化マスター 一問一答</h1><p class="lede">${e && e.message === "insecure"
    ? "このアドレスでは開けません。https:// で始まるアドレスから開いてください。"
    : "問題データを読み込めませんでした。電波のある所で、もう一度開いてください。"}</p>`;
  bar.innerHTML = `<button class="big" id="retry">もう一度読み込む</button>`;
  document.getElementById("retry").onclick = () => location.reload();
}
async function boot(){
  const app = document.getElementById("app"), bar = document.getElementById("bar");
  let saved = null; try { saved = localStorage.getItem(PKEY); } catch(e){}
  if (saved) {
    let d = null;
    try { d = await decrypt(saved); }
    catch(e){ if (!wrongPw(e)) return failScreen(e); }
    if (d) return main(d);
  }
  app.innerHTML = `<h1>証券化マスター 一問一答</h1>
    <p class="lede">最初の1回だけ合言葉を入れてください。次からは自動で開きます。</p>
    <p class="lede" style="margin-top:8px">ホーム画面のアイコンから開いている場合は、ここで入れてください。Safariで入れた合言葉と記録は、アイコンの側には引き継がれません。</p>
    <section><p class="label">合言葉</p><input id="pw" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
      style="width:100%;font:inherit;font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)">
    <p class="lede" style="margin-top:6px">英字キーボード（ABC）で入力するか、Macでコピーしてここに貼り付けてください。</p>
    <p id="err" class="lede" style="color:var(--ng);margin-top:8px"></p></section>`;
  bar.innerHTML = `<button class="big" id="open">開く</button>`;
  const go = async () => {
    const pw = normPw(document.getElementById("pw").value), err = document.getElementById("err");
    err.textContent = "確認しています…";
    let d = null;
    try { d = await decrypt(pw); }
    catch(e){ err.textContent = wrongPw(e) ? "合言葉が違います。合言葉.txt の文字をそのまま入れてください。" : "問題データを読み込めませんでした。電波のある所で、もう一度試してください。"; return; }
    try { localStorage.setItem(PKEY, pw); } catch(e){}
    main(d);
  };
  document.getElementById("open").onclick = go;
  document.getElementById("pw").onkeydown = e => { if (e.key === "Enter") go(); };
}
/* オフラインで使えるかどうかを、ホーム画面の注記に出す */
function offlineStatus(){
  if (!("caches" in window)) return;
  caches.match("data.enc").then(r => {
    window.__offlineText = r ? "　この端末にはオフライン用のデータが入っています。" : "　オフライン用のデータを準備中です。電波のある所で一度開いたままにしてください。";
    const el = document.getElementById("offline"); if (el) el.textContent = window.__offlineText;
  }).catch(() => {});
}
if ("serviceWorker" in navigator) {
  const had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").then(reg => {
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
  }).catch(() => {});
  navigator.serviceWorker.ready.then(offlineStatus);
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    offlineStatus();
    if (had) { window.__updateReady = true; if (window.__home) window.__home(); }
  });
}
const standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone;
if (standalone && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
boot();
